name: it-organizer
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itorganizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itorganizer}
      POSTGRES_DB: ${POSTGRES_DB:-itorganizer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./backend/app:/app/app", "./backend/tests:/app/tests"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./frontend:/app", "frontend_modules:/app/node_modules", "frontend_next:/app/.next"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
  notifications:
    build: ./services/notifications
    env_file: .env
    ports: ["127.0.0.1:8081:8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 5
  uploads:
    build: ./services/uploads
    env_file: .env
    ports: ["127.0.0.1:8082:8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
  frontend_modules:
  frontend_next:
